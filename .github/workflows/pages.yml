name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Seed releases/current metadata (packages live on R2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/releases/current
          tag=$(gh api repos/f00-sh/clun/releases/latest --jq .tag_name)
          ver=${tag#v}
          printf '%s\n' "$ver" > site/releases/current/VERSION
          python3 - <<PY
          import json
          from pathlib import Path
          ver = Path("site/releases/current/VERSION").read_text().strip()
          tag = f"v{ver}"
          base = "https://dist.f00.sh/clun/current"
          Path("site/releases/current/manifest.json").write_text(
              json.dumps(
                  {
                      "product": "clun",
                      "version": ver,
                      "tag": tag,
                      "channel": "current",
                      "download_base": base,
                      "assets": {
                          "linux-x64": f"{base}/clun-linux-x64.tar.gz",
                          "linux-arm64": f"{base}/clun-linux-arm64.tar.gz",
                          "darwin-x64": f"{base}/clun-darwin-x64.tar.gz",
                          "darwin-arm64": f"{base}/clun-darwin-arm64.tar.gz",
                          "checksums": f"{base}/checksums.txt",
                      },
                      "github_repo": "f00-sh/clun",
                      "note": "Packages on Cloudflare R2 (dist.f00.sh); install script on clun.f00.sh.",
                  },
                  indent=2,
              )
              + "\n"
          )
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=f00-clun --branch=master
